name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run package
      - name: Check dist/ is up to date
        run: |
          git add -N dist
          git diff --exit-code --stat dist || (echo "dist/ is out of date. Run 'npm run build' and commit it." && exit 1)
      - uses: actions/upload-artifact@v4
        with:
          name: csnypass-extension
          path: release/*.zip
